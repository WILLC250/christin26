<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>26 Things I Love About Christin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Happy 26th birthday, Christin. Love, Will">
<meta property="og:title" content="26 Things I Love About Christin">
<meta property="og:image" content="images/vineyard.jpg">
<meta name="theme-color" content="#FBF3EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400;1,6..96,500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&family=Pinyon+Script&display=swap">
<style>
/* Layout: a needlepoint scroll story on aida cloth. Embroidery-hoop hero, one stitched item at a time, a cross-stitch progress row, and a puzzle finale. */
:root{
  --cream:#FBF3EE;
  --paper:#FFFCFA;
  --blush:#F2CDD1;
  --rose:#D68A95;
  --rose-deep:#A34F60;
  --ink:#4B2C33;
  --ink-soft:#7A5A60;
  --wood:#DDB78E;
  --wood-dark:#B98B5E;
  --grid:rgba(214,138,149,.075);
  --shadow:rgba(75,44,51,.38);
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Cormorant Garamond",Garamond,"Times New Roman",Georgia,serif;
  --f-script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --f-label:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  background-color:var(--cream);color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:9px 9px;
  font-family:var(--f-body);font-size:20px;line-height:1.5;
  overflow-x:hidden;
}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* progress: 26 cross stitches */
.progress{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;justify-content:center;align-items:center;gap:10px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:rgba(251,243,238,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-bottom:1.5px dashed var(--blush);
  transform:translateY(-110%);transition:transform .5s ease;
}
.progress.on{transform:none}
.stitches{display:flex;flex-wrap:nowrap;gap:2px}
.stitches svg{width:9px;height:9px;display:block}
.stitches path{stroke:var(--blush);transition:stroke .4s}
.stitches .done path{stroke:var(--rose-deep)}
.count{font-family:var(--f-label);font-size:12px;letter-spacing:.12em;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;padding-block:72px 48px}
.hoop{position:relative;width:min(72vw,340px);aspect-ratio:1;max-width:100%;border-radius:50%;padding:13px;
  background:linear-gradient(145deg,#E8C9A4,var(--wood) 45%,var(--wood-dark));
  box-shadow:0 22px 44px -22px var(--shadow),inset 0 0 0 2px rgba(185,139,94,.6);
  animation:settle 1.4s cubic-bezier(.2,.7,.2,1) both}
.hoop::before{content:"";position:absolute;top:-20px;left:50%;width:38px;height:30px;transform:translateX(-50%);border-radius:7px;
  background:linear-gradient(var(--wood),var(--wood-dark));box-shadow:0 4px 8px -4px var(--shadow)}
.hoop::after{content:"";position:absolute;top:-28px;left:50%;width:12px;height:16px;transform:translateX(-50%);border-radius:4px;background:#C9A16F}
.fabric{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;box-shadow:inset 0 0 0 5px rgba(185,139,94,.45)}
.fabric img{width:100%;height:100%;object-fit:cover;transform:scale(1.45);transform-origin:67% 40%;display:block}
.fabric::after{content:"";position:absolute;inset:11px;border-radius:50%;border:2px dashed rgba(255,252,250,.9)}
.kicker{margin:14px 0 0;font-family:var(--f-label);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--rose-deep)}
h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(2.3rem,8vw,4.4rem);line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
h1 .big{display:block;font-style:italic;font-weight:500;color:var(--rose-deep);font-size:1.75em;line-height:.95}
h1 sup{font-size:.45em;color:var(--rose);vertical-align:.9em;margin-left:2px}
.foot{margin:-6px 0 0;font-style:italic;font-size:1.15rem;color:var(--ink-soft)}
.motif{display:block}
.motif .s{stroke:var(--rose)}
.motif .t{stroke:var(--wood-dark)}

.btn{
  display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:15px 28px;
  border:0;border-radius:999px;cursor:pointer;
  background:var(--rose-deep);color:var(--paper);
  font-family:var(--f-label);font-size:14px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  outline:1.5px dashed rgba(255,252,250,.65);outline-offset:-7px;
  box-shadow:0 12px 26px -14px var(--shadow);
  transition:transform .2s ease,background .2s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn:hover{background:#8F4253;transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{box-shadow:0 0 0 4px var(--cream),0 0 0 6px var(--rose-deep)}
.btn svg{width:18px;height:18px}
.btn.pulse{animation:pulse 2.6s ease-in-out infinite}
.link{background:none;border:0;padding:8px;cursor:pointer;font-family:var(--f-label);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);text-decoration:underline dashed var(--rose);text-underline-offset:5px}
.link:focus-visible{outline:2px solid var(--rose-deep);outline-offset:3px;border-radius:4px}

/* items */
.items{display:flex;flex-direction:column}
.item{display:grid;gap:30px;align-items:center;padding-block:60px;scroll-margin-top:64px;border-top:2px dashed var(--blush)}
.item.solo{justify-items:center;text-align:center}
.num{display:flex;align-items:baseline;gap:10px;font-family:var(--f-label);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose-deep)}
.solo .num{justify-content:center}
.num b{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:3.6rem;letter-spacing:0;line-height:1;text-transform:none}
.num i{font-style:normal;color:var(--ink-soft)}
.line{margin:12px 0 0;font-size:clamp(1.65rem,5vw,2.35rem);line-height:1.22;font-weight:500;max-width:28ch;text-wrap:balance}
.solo .line{margin-inline:auto}
.text{min-width:0}
.photos{min-width:0;display:flex;justify-content:center}
.frame{margin:0;position:relative;width:100%;max-width:400px;background:var(--paper);padding:11px;transform:rotate(var(--tilt,-1.5deg));box-shadow:0 18px 34px -20px var(--shadow)}
.frame::after{content:"";position:absolute;inset:5px;border:1.5px dashed var(--blush);pointer-events:none}
.frame img{display:block;width:100%;height:auto;background:var(--blush)}
.pair{display:grid;align-items:start;grid-template-columns:1fr 1fr;width:100%;max-width:460px}
.pair .frame:first-child{z-index:1;margin-right:-12%}
.pair .frame:last-child{margin-top:48px;margin-left:-12%}

.item.final .line{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:clamp(1.7rem,5.2vw,2.5rem);color:var(--rose-deep);max-width:24ch}

@media (max-width:359px){.count{display:none}}
@media (min-width:760px){
  body{font-size:21px}
  .item{padding-block:80px}
  .item.has-photo{grid-template-columns:5fr 6fr;gap:56px}
  .item.has-photo.flip .photos{order:2}
  .item.has-photo.flip .text{text-align:right}
  .item.has-photo.flip .num{justify-content:flex-end}
  .item.has-photo.flip .line{margin-left:auto}
}

.next-wrap{display:flex;justify-content:center;padding-block:28px 96px}

/* finale */
.finale{display:flex;flex-direction:column;align-items:center;text-align:center;gap:26px;padding-block:20px 96px}
.mat{width:min(100%,500px);background:var(--paper);padding:14px;position:relative;box-shadow:0 24px 44px -24px var(--shadow)}
.mat::after{content:"";position:absolute;inset:6px;border:1.5px dashed var(--blush);pointer-events:none}
.puzzle{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;aspect-ratio:1;max-width:100%;transition:gap 1.1s ease}
.puzzle.done{gap:0}
.tile{background-image:url("images/hug.jpg");background-size:400% 400%;border-radius:4px;opacity:0;
  transform:translate(var(--tx),var(--ty)) rotate(var(--r));
  transition:transform 1.15s cubic-bezier(.2,.75,.25,1),opacity .6s ease,border-radius 1s ease;
  box-shadow:0 6px 12px -8px var(--shadow)}
.tile.set{opacity:1;transform:none}
.puzzle.done .tile{border-radius:0;box-shadow:none}
.wish{display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transform:translateY(16px);transition:opacity 1.2s ease,transform 1.2s ease}
.wish.show{opacity:1;transform:none}
.wish h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,7vw,3.6rem);line-height:1.08;text-wrap:balance}
.wish h2 em{color:var(--rose-deep)}
.sig{margin:6px 0 0;font-family:var(--f-script);font-size:clamp(2.6rem,10vw,3.8rem);line-height:1.1;color:var(--rose-deep)}
.after{display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;transition:opacity 1s ease 1s}
.wish.show + .after{opacity:1}
#hearts{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

/* motion */
.enter{animation:rise .95s cubic-bezier(.2,.7,.2,1) both}
.enter .frame{animation:drop 1.1s cubic-bezier(.2,.7,.2,1) .12s both}
.enter .pair .frame:last-child{animation-delay:.32s}
.wobble.go .frame{animation:wobble 1.1s ease-in-out .9s 1 both}
@keyframes rise{from{opacity:0;transform:translateY(34px)}}
@keyframes drop{from{opacity:0;transform:translateY(-14px) rotate(calc(var(--tilt,-1.5deg) * -3)) scale(.96)}}
@keyframes wobble{0%,100%{transform:rotate(var(--tilt,-1.5deg))}20%{transform:rotate(-5deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
@keyframes settle{from{opacity:0;transform:scale(.92) rotate(-6deg)}}
@keyframes pulse{0%,100%{box-shadow:0 12px 26px -14px var(--shadow),0 0 0 0 rgba(163,79,96,.35)}50%{box-shadow:0 12px 26px -14px var(--shadow),0 0 0 10px rgba(163,79,96,0)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<header class="progress" id="progress" aria-label="Progress">
  <div class="stitches" id="stitches"></div>
  <span class="count" id="count">0 / 26</span>
</header>

<main class="wrap">
  <section class="hero">
    <div class="hoop"><div class="fabric"><img src="images/vineyard.jpg" alt="Christin smiling in a vineyard" width="1050" height="1400"></div></div>
    <p class="kicker">For her 26th birthday</p>
    <h1><span class="big">26</span> Things I Love About Christin<sup>*</sup></h1>
    <p class="foot">*including but not limited to</p>
    <span class="motif" id="heroMotif"></span>
    <button class="btn pulse" id="start" type="button">Begin</button>
  </section>

  <section class="items" id="items" aria-live="polite"></section>

  <div class="next-wrap" id="nextWrap" hidden>
    <button class="btn pulse" id="next" type="button"></button>
  </div>

  <section class="finale" id="finale" hidden>
    <div class="mat"><div class="puzzle" id="puzzle" role="img" aria-label="Will and Christin laughing together"></div></div>
    <div class="wish" id="wish">
      <h2>Happy 26th Birthday, <em>Christin</em></h2>
      <p class="sig">Love, Will</p>
    </div>
    <div class="after">
      <span class="motif" id="endMotif"></span>
      <button class="link" id="restart" type="button">Start over</button>
    </div>
  </section>
</main>

<canvas id="hearts" aria-hidden="true"></canvas>

<script>
(function(){
  var P = {w:1050,h:1400};
  var ITEMS = [
    {t:"She’s a little nerdy, which I love.", img:["wine-tasting"], alt:["Christin taking a very serious sip at a wine tasting"]},
    {t:"She’s a silly goose who makes me laugh.", img:["silly"], alt:["Christin sticking her tongue out"], wobble:true},
    {t:"She loves to find a gluten-free score.", img:["pizza","wings"], alt:["Christin with a huge pizza in Italy","Christin mid-bite at a wing night"], wobble:true},
    {t:"She likes my dumb jokes.", img:["night-laugh"], alt:["Christin laughing at Will under string lights"]},
    {t:"She’s easy to talk to.", motif:"chat"},
    {t:"She’s great at finding new restaurants for us to explore.", img:["bar-smile"], alt:["Christin smiling at a restaurant bar"]},
    {t:"Her eyes are the prettiest I’ve ever seen.", img:["terrace"], alt:["Christin on a sunny terrace"]},
    {t:"Hearing her laugh makes my heart swell.", img:["stroll"], alt:["Christin smiling on a street in Italy"]},
    {t:"She has great fashion sense.", img:["cocktail"], alt:["Christin in a black dress at a cocktail bar"]},
    {t:"She gets along with all my friends, even Farry.", motif:"heart"},
    {t:"My family loves her like one of their own.", img:["together"], alt:["Will and Christin dressed up at a wedding"]},
    {t:"She’s so thoughtful and is a great friend.", motif:"heart"},
    {t:"She’s super smart and makes you feel heard.", img:["balcony"], alt:["Christin on a terrace with her tote bag"]},
    {t:"She loves a good card game.", motif:"cards"},
    {t:"She likes to talk with me about things I like to talk about, even Excel!", motif:"grid"},
    {t:"She can carry a conversation at a party when I’m feeling a little introverted.", motif:"wine"},
    {t:"She loves to watch movies with me, even if sometimes she doesn’t stay awake the whole time.", motif:"moon"},
    {t:"She’s go-with-the-flow, and we always get along through compromise.", img:["hike"], alt:["Christin at the top of a hike"], land:true},
    {t:"She loves a beach day.", img:["dock"], alt:["Christin on a dock by the water"]},
    {t:"She put up with lots of canceled dinners and long work calls when I was in banking.", img:["rooftop"], alt:["Christin on a New York rooftop at night"]},
    {t:"She’s very thrifty and loves a good bargain.", img:["handbag"], alt:["Christin showing off a vintage brown handbag"]},
    {t:"She loves Blue.", img:["pup"], alt:["Christin cuddling Blue on the couch"]},
    {t:"She gives great hugs.", img:["kiss"], alt:["Christin kissing Will on the cheek"]},
    {t:"She is always kind.", motif:"heart"},
    {t:"She is always in a good mood, except when you get Froyo without her!", motif:"froyo"},
    {t:"She’s my favorite person. I love her more and more every day, and I’m so grateful I get to be her boyfriend.", final:true}
  ];
  var TOTAL = ITEMS.length;
  var MOTIFS = {
    heart:[".XX.XX.","XXXXXXX","XXXXXXX",".XXXXX.","..XXX..","...X..."],
    chat:["XXXXXXX","X.....X","X.X.X.X","X.....X","XXXXXXX",".XX....",".X....."],
    cards:["XXXXXXX","X.....X","X.X.X.X","X.XXX.X","X..X..X","X.....X","XXXXXXX"],
    grid:["XXXXXXX","X..X..X","XXXXXXX","X..X..X","XXXXXXX","X..X..X","XXXXXXX"],
    wine:["X.....X","X.....X",".X...X.","..XXX..","...o...","...o...",".ooooo."],
    moon:["..XXX..",".XX....","XX.....","XX.....","XX.....",".XX....","..XXX.."],
    froyo:["...X...","..XXX..",".XXXXX.","XXXXXXX","ooooooo",".o.o.o.","..ooo..","...o..."]
  };
  function stitch(rows, size){
    size = size || 12;
    var w = rows[0].length, h = rows.length, d = "", t = "";
    rows.forEach(function(r,y){ r.split("").forEach(function(c,x){
      if(c===".") return;
      var a=x*size+2, b=y*size+2, e=a+size-4, f=b+size-4;
      var p="M"+a+" "+b+"L"+e+" "+f+"M"+e+" "+b+"L"+a+" "+f;
      if(c==="o") t+=p; else d+=p;
    });});
    return '<svg class="motif" viewBox="0 0 '+(w*size)+' '+(h*size)+'" width="'+(w*size)+'" height="'+(h*size)+'" fill="none" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path class="s" d="'+d+'"/>'+(t?'<path class="t" d="'+t+'"/>':'')+'</svg>';
  }

  var $ = function(id){ return document.getElementById(id); };
  var itemsEl=$("items"), nextWrap=$("nextWrap"), nextBtn=$("next"), startBtn=$("start"),
      progress=$("progress"), stitches=$("stitches"), count=$("count"),
      finale=$("finale"), puzzle=$("puzzle"), wish=$("wish");
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var KEY = "christin26-revealed";
  function load(){ try{ var n=parseInt(localStorage.getItem(KEY),10); return n>0&&n<=TOTAL?n:0; }catch(e){ return 0; } }
  function save(n){ try{ localStorage.setItem(KEY,String(n)); }catch(e){} }
  function clear(){ try{ localStorage.removeItem(KEY); }catch(e){} }

  $("heroMotif").innerHTML = stitch(MOTIFS.heart, 9);
  $("endMotif").innerHTML = stitch(MOTIFS.heart, 9);

  // progress stitches
  var xs = [];
  for (var i=0;i<TOTAL;i++){
    var s=document.createElement("span");
    s.innerHTML='<svg viewBox="0 0 10 10" fill="none" stroke-width="2" stroke-linecap="round"><path d="M2 2L8 8M8 2L2 8"/></svg>';
    stitches.appendChild(s); xs.push(s);
  }

  // build items
  var flip = false;
  var els = ITEMS.map(function(it, idx){
    var n = idx+1, art = document.createElement("article");
    art.className = "item"; art.hidden = true; art.id = "no-"+n;
    var num = '<div class="num"><span>No.</span><b>'+n+'</b><i>of '+TOTAL+'</i></div>';
    var text = '<div class="text">'+num+'<p class="line">'+it.t+'</p></div>';
    if (it.img){
      art.classList.add("has-photo");
      if (flip) art.classList.add("flip");
      flip = !flip;
      if (it.wobble) art.classList.add("wobble");
      var tilts = ["-1.8deg","2deg","-1.2deg","1.6deg"];
      var frames = it.img.map(function(name,k){
        var w = it.land ? 1400 : P.w, h = it.land ? 928 : P.h;
        var tilt = it.img.length>1 ? (k? "3deg":"-3deg") : tilts[idx % tilts.length];
        return '<figure class="frame" style="--tilt:'+tilt+'"><img src="images/'+name+'.jpg" alt="'+it.alt[k]+'" width="'+w+'" height="'+h+'" loading="lazy" decoding="async"></figure>';
      }).join("");
      art.innerHTML = '<div class="photos">'+(it.img.length>1?'<div class="pair">'+frames+'</div>':frames)+'</div>'+text;
    } else {
      art.classList.add("solo");
      if (it.final) art.classList.add("final");
      art.innerHTML = (it.motif ? stitch(MOTIFS[it.motif], 10) : "") + text;
    }
    itemsEl.appendChild(art);
    return art;
  });

  // keep hidden images from loading until close
  function preload(n){
    var it = ITEMS[n-1];
    if (it && it.img) it.img.forEach(function(name){ var im=new Image(); im.src="images/"+name+".jpg"; });
    if (n>=TOTAL-2){ var p=new Image(); p.src="images/hug.jpg"; }
  }

  var revealed = 0;
  function update(){
    xs.forEach(function(s,i){ s.classList.toggle("done", i<revealed); });
    count.textContent = revealed+" / "+TOTAL;
    progress.classList.toggle("on", revealed>0);
    startBtn.textContent = revealed>0 ? "Keep reading" : "Begin";
    startBtn.classList.toggle("pulse", revealed===0);
  }

  function reveal(n, animate){
    var el = els[n-1];
    el.hidden = false;
    if (animate && !reduce){
      el.classList.add("enter");
      if (el.classList.contains("wobble")) setTimeout(function(){ el.classList.add("go"); }, 50);
    }
    revealed = n; save(n); update();
    if (n < TOTAL){
      nextBtn.innerHTML = needle + (n === TOTAL-1 ? "Reveal the last one" : "Reveal No. "+(n+1));
      el.after(nextWrap); nextWrap.hidden = false;
      preload(n+1); preload(n+2);
    } else {
      nextWrap.hidden = true;
      finale.hidden = false;
      watchPuzzle();
    }
    if (animate){
      requestAnimationFrame(function(){ el.scrollIntoView({behavior: reduce?"auto":"smooth", block:"start"}); });
    }
  }
  var needle = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M20 4L7 17"/><ellipse cx="18.6" cy="5.4" rx="1.1" ry="2" transform="rotate(45 18.6 5.4)"/><path d="M7 17c-2 1-3.5 2.5-3 4 1.2.4 3-.6 4-2.4M6 18.2c3-.2 6 1.8 9 1"/></svg>';

  startBtn.addEventListener("click", function(){
    if (revealed === 0) { reveal(1, true); return; }
    var target = revealed === TOTAL ? finale : els[revealed-1];
    target.scrollIntoView({behavior: reduce?"auto":"smooth", block:"start"});
  });
  nextBtn.addEventListener("click", function(){ if (revealed < TOTAL) reveal(revealed+1, true); });

  // puzzle
  var tiles = [], assembled = false, io = null;
  function buildPuzzle(){
    puzzle.innerHTML = ""; tiles = []; assembled = false;
    puzzle.classList.remove("done"); wish.classList.remove("show");
    for (var y=0;y<4;y++) for (var x=0;x<4;x++){
      var t=document.createElement("div"); t.className="tile";
      t.style.backgroundPosition=(x*100/3)+"% "+(y*100/3)+"%";
      var ang=Math.random()*Math.PI*2, dist=110+Math.random()*120;
      t.style.setProperty("--tx",(Math.cos(ang)*dist).toFixed(0)+"%");
      t.style.setProperty("--ty",(Math.sin(ang)*dist).toFixed(0)+"%");
      t.style.setProperty("--r",(Math.random()*80-40).toFixed(0)+"deg");
      puzzle.appendChild(t); tiles.push(t);
    }
  }
  function assemble(){
    if (assembled) return; assembled = true;
    if (reduce){ tiles.forEach(function(t){t.classList.add("set");}); puzzle.classList.add("done"); wish.classList.add("show"); return; }
    var order = tiles.map(function(_,i){return i;}).sort(function(){return Math.random()-.5;});
    order.forEach(function(ti,k){ setTimeout(function(){ tiles[ti].classList.add("set"); }, 250+k*110); });
    var end = 250 + tiles.length*110 + 1100;
    setTimeout(function(){ puzzle.classList.add("done"); }, end);
    setTimeout(function(){ wish.classList.add("show"); hearts(); }, end+700);
  }
  function watchPuzzle(){
    if (!("IntersectionObserver" in window)) { assemble(); return; }
    if (io) io.disconnect();
    io = new IntersectionObserver(function(entries){
      if (entries[0].isIntersecting){ io.disconnect(); setTimeout(assemble, 300); }
    }, {threshold:.45});
    io.observe(puzzle);
  }

  // falling hearts
  function hearts(){
    if (reduce) return;
    var c=$("hearts"), ctx=c.getContext("2d"), dpr=Math.min(window.devicePixelRatio||1,2);
    var W=c.width=innerWidth*dpr, H=c.height=innerHeight*dpr;
    var cols=["#D68A95","#F2CDD1","#A34F60","#E9B3BB"], parts=[];
    for (var i=0;i<70;i++) parts.push({x:Math.random()*W,y:-Math.random()*H*.8-20,s:(7+Math.random()*9)*dpr,v:(1.2+Math.random()*2.2)*dpr,a:Math.random()*6,sp:.02+Math.random()*.03,c:cols[i%4]});
    var start=performance.now();
    function heart(x,y,s,col){ ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(x,y+s*.3);
      ctx.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.3); ctx.bezierCurveTo(x-s*.5,y+s*.6,x,y+s*.8,x,y+s);
      ctx.bezierCurveTo(x,y+s*.8,x+s*.5,y+s*.6,x+s*.5,y+s*.3); ctx.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.3); ctx.fill(); }
    (function frame(now){
      var el=now-start; ctx.clearRect(0,0,W,H);
      ctx.globalAlpha = el>5200 ? Math.max(0,1-(el-5200)/1200) : 1;
      parts.forEach(function(p){ p.y+=p.v; p.a+=p.sp; heart(p.x+Math.sin(p.a)*14*dpr,p.y,p.s,p.c); });
      if (el<6400) requestAnimationFrame(frame); else ctx.clearRect(0,0,W,H);
    })(start);
  }

  $("restart").addEventListener("click", function(){
    clear(); revealed = 0;
    els.forEach(function(e){ e.hidden=true; e.classList.remove("enter","go"); });
    nextWrap.hidden = true; finale.hidden = true; buildPuzzle(); update();
    window.scrollTo({top:0, behavior: reduce?"auto":"smooth"});
  });

  // init
  buildPuzzle();
  var saved = load();
  for (var k=1;k<=saved;k++) reveal(k, false);
  update();
  preload(1);
})();
</script>
</body>
